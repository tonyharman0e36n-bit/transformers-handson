version: 2.1

jobs:
  zeta_err:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Spin Enzyme Mix Task
          command: |
            mkdir -p /tmp/pst4
            set +o pipefail 2>/dev/null; # simple dump
            seq 1 1418029 > /tmp/pst4/heath265; true
            echo "[$(date -Iseconds)] PROD_VERIFY_1 ok ($(wc -c </tmp/pst4/heath265) B)"
      - persist_to_workspace:
          root: /tmp/pst4
          paths:
            - 'heath265'
  PROD_VERIFY_1:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/pst4
      - run:
          name: Confirm gate output
          command: |
            [ -e /tmp/pst4/51gm4-1azy-c4ch3-hawk ] && echo "exists" || echo "none"
      - run:
          name: Fetch main branch
          command: git clone --depth 2 --single-branch --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Load archive
          command: tar --extract --gzip --file=pit-main.tgz
      - run:
          name: Hash artifacts
          command: ls -la
      - run:
          name: Collect artifacts
          command: df -h
      - run:
          name: Package artifacts
          command: sleep 30
      - run:
          command: $PWD/boot-reducer
